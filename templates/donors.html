
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المتبرعين - بسمة أمل</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        h1, h2 {
            text-align: center;
            color: #4e73df;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        button {
            background: #4e73df;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background: #4e73df;
            color: white;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #4e73df;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>إدارة المتبرعين</h1>

    <form method="POST">
        <input type="text" name="Name"
               placeholder="اسم المتبرع" required>

        <input type="text" name="Phone"
               placeholder="رقم الهاتف" required>

        <button type="submit">إضافة متبرع</button>
    </form>

    <h2>قائمة المتبرعين</h2>

    <table>
        <tr>
            <th>رقم المتبرع</th>
            <th>الاسم</th>
            <th>رقم الهاتف</th>
        </tr>

        {% for donor in donors %}
        <tr>
            <td>{{ donor['Donor_ID'] }}</td>
            <td>{{ donor['Name'] }}</td>
            <td>{{ donor['Phone'] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/">العودة للصفحة الرئيسية</a>

</div>
</body>
</html>
