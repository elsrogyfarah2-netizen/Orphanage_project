
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المشرفين - بسمة أمل</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: #4e73df;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            background: #4e73df;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #4e73df;
            color: white;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #4e73df;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>إدارة المشرفين</h1>

        <form method="POST">
            <input type="text" name="Name" placeholder="اسم المشرف" required>

            <input type="text" name="Phone" placeholder="رقم الهاتف" required>

            <button type="submit">إضافة مشرف</button>
        </form>

        <h2>قائمة المشرفين</h2>

        <table>
            <tr>
                <th>رقم المشرف</th>
                <th>اسم المشرف</th>
                <th>رقم الهاتف</th>
            </tr>

            {% for supervisor in supervisors %}
            <tr>
                <td>{{ supervisor['Supervisor_ID'] }}</td>
                <td>{{ supervisor['Name'] }}</td>
                <td>{{ supervisor['Phone'] }}</td>
            </tr>
            {% endfor %}
        </table>

        <a href="/">العودة للصفحة الرئيسية</a>
    </div>
</body>
</html>
