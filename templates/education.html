
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة التعليم - بسمة أمل</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        h1, h2 {
            text-align: center;
            color: #4e73df;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        button {
            background: #4e73df;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background: #4e73df;
            color: white;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #4e73df;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>إدارة التعليم</h1>

    <form method="POST">
        <input type="number" name="Child_ID"
               placeholder="رقم الطفل" required>

        <input type="text" name="Grade"
               placeholder="الصف الدراسي" required>

        <input type="text" name="Academic_Year"
               placeholder="السنة الدراسية" required>

        <input type="text" name="Result"
               placeholder="النتيجة" required>

        <button type="submit">إضافة سجل تعليمي</button>
    </form>

    <h2>السجلات التعليمية</h2>

    <table>
        <tr>
            <th>رقم السجل</th>
            <th>رقم الطفل</th>
            <th>الصف</th>
            <th>السنة الدراسية</th>
            <th>النتيجة</th>
        </tr>

        {% for item in education %}
        <tr>
            <td>{{ item['Education_ID'] }}</td>
            <td>{{ item['Child_ID'] }}</td>
            <td>{{ item['Grade'] }}</td>
            <td>{{ item['Academic_Year'] }}</td>
            <td>{{ item['Result'] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/">العودة للصفحة الرئيسية</a>

</div>
</body>
</html>
