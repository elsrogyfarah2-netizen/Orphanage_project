
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الزيارات - بسمة أمل</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        h1, h2 {
            text-align: center;
            color: #4e73df;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        button {
            background: #4e73df;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background: #4e73df;
            color: white;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            color: #4e73df;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>إدارة الزيارات</h1>

    <form method="POST">
        <input type="number" name="Visitor_ID"
               placeholder="رقم الزائر" required>

        <input type="number" name="Child_ID"
               placeholder="رقم الطفل" required>

        <input type="date" name="Visit_Date" required>

        <textarea name="Notes"
                  placeholder="ملاحظات الزيارة"></textarea>

        <button type="submit">إضافة زيارة</button>
    </form>

    <h2>قائمة الزيارات</h2>

    <table>
        <tr>
            <th>رقم الزيارة</th>
            <th>رقم الزائر</th>
            <th>رقم الطفل</th>
            <th>تاريخ الزيارة</th>
            <th>الملاحظات</th>
        </tr>

        {% for visit in visits %}
        <tr>
            <td>{{ visit['Visit_ID'] }}</td>
            <td>{{ visit['Visitor_ID'] }}</td>
            <td>{{ visit['Child_ID'] }}</td>
            <td>{{ visit['Visit_Date'] }}</td>
            <td>{{ visit['Notes'] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/">العودة للصفحة الرئيسية</a>

</div>
</body>
</html>
